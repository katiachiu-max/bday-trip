    <style>
        /* Fonts Import - 載入 Bodoni Moda (時尚雜誌風高級字體) */

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #F7F7F7;
            -webkit-tap-highlight-color: transparent;
        }

        /* 專門給英文/數字用的高級字體 - Bodoni Moda */
        .font-en {
            font-family: 'Bodoni Moda', serif !important;
            letter-spacing: 0.02em; 
        }

        /* 專門給中文用的高級字體 - Zen Old Mincho */
        .font-jp {
            font-family: 'Zen Old Mincho', 'Noto Serif TC', serif !important;
        }

        /* Hide Scrollbar */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* App Container */
        .app-container {
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative; 
            min-height: 100vh;
            background-color: #ffffff;
        }

        /* Home Screen Animation */
        #home-screen {
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
            transform: translateY(0);
            opacity: 1;
        }

        /* Text Shadow for Hero */
        .text-shadow-hero {
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
        }

        /* Tag Styles */
        .guide-tag {
            display: inline-block;
            padding: 2px 8px;
            margin-right: 4px;
            margin-bottom: 4px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.025em;
        }
        .tag-food { background-color: #FFF7ED; color: #C2410C; border: 1px solid #FFEDD5; }
        .tag-important { background-color: #FEF2F2; color: #B91C1C; border: 1px solid #FECACA; }
        .tag-funfact { background-color: #EFF6FF; color: #1D4ED8; border: 1px solid #BFDBFE; }

        /* Weather Card */
        .ios-weather-card {
            background: linear-gradient(135deg, #374151, #111827);
            color: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* Accordion Transition */
        #booking-details {
            transition: max-height 0.5s ease-in-out, opacity 0.4s ease-in-out, padding 0.4s;
            overflow: hidden;
            opacity: 1;
            max-height: 1000px; /* Arbitrary large height */
        }
        .collapsed-content {
            max-height: 0 !important;
            opacity: 0;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
        }

        /* Sticky Nav Adjustment */
        #day-tabs {
            transition: top 0.3s ease;
        }

</head>

        // 2. STATE MANAGEMENT
        const dayTabs = document.getElementById('day-tabs');
        const itineraryContent = document.getElementById('itinerary-content');
        const budgetSummary = document.getElementById('budget-summary');
        const bookingDetails = document.getElementById('booking-details');
        const homeScreen = document.getElementById('home-screen');
        const toggleIcon = document.getElementById('toggle-icon');
        let currentActiveDay = null;
        let isBookingDetailsOpen = true;

        // 3. CORE FUNCTIONS

        function enterApp() {
            // 播放彩帶特效 - 從上方飄落
            // 設定動畫持續時間
            var duration = 2.5 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            var randomInRange = (min, max) => Math.random() * (max - min) + min;

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                
                // 隨機從上方產生彩帶
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
                    colors: ['#FFC0CB', '#FFD700', '#FFFFFF', '#FF69B4'], // 粉、金、白
                    gravity: 1.2,
                    scalar: 1.2
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
                    colors: ['#87CEEB', '#E0FFFF', '#FFFFFF'], // 藍、白
                    gravity: 1.2,
                    scalar: 1.2
                }));
            }, 250);

            // 稍微延遲轉場，讓使用者能看到彩帶開始飄
            setTimeout(() => {
                homeScreen.style.transform = 'translateY(-100%)';
                setTimeout(() => { 
                    homeScreen.style.display = 'none'; 
                    updateStickyHeaderPosition(); // Recalculate sticky once hero is gone
                }, 600);
            }, 200);
        }

        // Logic to keep tabs sticky exactly below the header, even when header resizes
        function updateStickyHeaderPosition() {
            const headerHeight = document.getElementById('main-header').offsetHeight;
            dayTabs.style.top = `${headerHeight}px`;
        }

        function toggleBookingDetails() {
            isBookingDetailsOpen = !isBookingDetailsOpen;
            if (isBookingDetailsOpen) {
                bookingDetails.classList.remove('collapsed-content');
                toggleIcon.classList.remove('rotate-180');
            } else {
                bookingDetails.classList.add('collapsed-content');
                toggleIcon.classList.add('rotate-180');
            }
            
            // Wait for transition to end then update sticky position
            setTimeout(updateStickyHeaderPosition, 550);
        }

        function updateBudget() {
            let total = 0;
            itineraryData.forEach(d => d.events.forEach(e => {
                // 修改：只計算 1. 交通費 (transport) 2. 已預訂的晚餐 (Ushigoro)
                if (e.category === 'transport' || e.activity.includes('Ushigoro')) {
                    total += e.cost;
                }
            }));
            
            // 設定總預算與匯率估算
            const budgetHKD = 12000;
            const exchangeRate = 0.052; // 預估匯率 (1 JPY ≈ 0.052 HKD)
            const estimatedCostHKD = Math.round(total * exchangeRate);
            const remainingHKD = budgetHKD - estimatedCostHKD;

            document.getElementById('budget-summary').innerHTML = `
                <div class="flex flex-col items-end">
                    <span class="text-[10px] text-gray-400 uppercase font-bold tracking-wider font-en">BUDGET HK$${budgetHKD.toLocaleString()}</span>
                    <span class="text-sm font-bold ${remainingHKD >= 0 ? 'text-emerald-600' : 'text-red-500'} font-en">
                        BALANCE HK$${remainingHKD.toLocaleString()}
                    </span>
                    <span class="text-[9px] text-gray-400 mt-0.5 font-en">
                        (EXPENSES ¥${total.toLocaleString()})
                    </span>
                </div>
            `;
        }

                    <div class="text-sm text-indigo-800/80 space-y-1 pl-8">

                        <p class="text-xs opacity-75 font-en">${BOOKING_INFO.hotel.address}</p>
                        <div class="mt-2 flex gap-2">

        }

        function renderTabs() {
            dayTabs.innerHTML = '';
            itineraryData.forEach((day, idx) => {
                const btn = document.createElement('button');
                btn.className = `flex-1 py-4 text-center text-sm font-medium transition-colors border-b-2 outline-none focus:outline-none ${idx === 0 ? 'border-emerald-500 text-emerald-600 bg-emerald-50/50' : 'border-transparent text-gray-400 hover:text-gray-600'}`;
                // 分離日期與中文星期，讓日期用 font-en
                btn.innerHTML = `<span class="block text-xs opacity-70 font-en">${day.shortDate}</span><span class="block font-bold text-lg">${day.date.split('(')[1].replace(')','')}</span>`;
                btn.onclick = () => switchDay(idx);
                dayTabs.appendChild(btn);
            });
        }

        function getWeatherSvg(condition) {
            if(condition === 'sunny') return `<svg class="w-8 h-8 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>`;
            if(condition === 'cloudy') return `<svg class="w-8 h-8 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>`;
            return `<svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>`;
        }

        function switchDay(index) {
            if(currentActiveDay === index) return;
            currentActiveDay = index;

            // Update Tabs UI
            Array.from(dayTabs.children).forEach((btn, idx) => {
                if(idx === index) {
                    btn.className = 'flex-1 py-4 text-center transition-all border-b-4 border-emerald-500 text-emerald-700 bg-emerald-50';
                } else {
                    btn.className = 'flex-1 py-4 text-center transition-all border-b-4 border-transparent text-gray-400 hover:bg-gray-50';
                }
            });

            const day = itineraryData[index];
            
            // Render Timeline
            let content = `
                <div class="mb-6">
                    <p class="text-gray-400 text-sm font-jp">${day.city}</p>
                </div>

                <!-- Weather Card -->
                <div class="ios-weather-card mb-8 flex items-center justify-between">
                    <div>
                        <div class="text-3xl font-light font-en">${day.weather.temp}</div>
                        <div class="text-sm opacity-75 font-medium tracking-wide font-jp">${day.weather.summary}</div>
                    </div>
                    <div>${getWeatherSvg(day.weather.condition)}</div>
                </div>

                <!-- Timeline -->
                <div class="relative pl-4 space-y-8 before:absolute before:left-[27px] before:top-2 before:bottom-4 before:w-[2px] before:bg-gray-100">
            `;

            day.events.forEach(ev => {
                const isWarning = ev.isWarning ? 'bg-red-50 border-red-200' : 'bg-white border-gray-100';
                
                // 判斷是否顯示價格標籤
                const showCostBadge = ev.cost > 0 || ev.category === 'attraction' || ev.category === 'hotel';

                content += `
                    <div class="relative z-10">
                        <!-- Icon Bubble -->
                        <div class="absolute left-0 top-0 w-10 h-10 rounded-full bg-white border-4 border-gray-50 shadow-sm flex items-center justify-center text-lg z-20">
                            ${ev.icon}
                        </div>
                        
                        <!-- Content -->
                        <div class="ml-14">
                            <div class="${isWarning} border p-4 rounded-xl shadow-sm hover:shadow-md transition-shadow">
                                <h3 class="font-bold text-gray-800 text-lg mb-3 font-jp">${ev.activity}</h3>
                                
                                <ul class="space-y-2 text-sm text-gray-600">
                                    <li class="flex items-start">
                                        <span class="mr-2 text-lg">⏰</span>
                                        <span class="mt-0.5 font-semibold font-en ${ev.isWarning ? 'text-red-600' : ''}">${ev.time}</span>
                                    </li>
                                    ${ev.address ? `
                                    <li class="flex items-start">
                                        <span class="mr-2 text-lg">📍</span>
                                        <span class="mt-0.5 font-en">${ev.address}</span>
                                    </li>
                                    ` : ''}
                                    <li class="flex items-start">
                                        <span class="mr-2 text-lg">📝</span>
                                        <span class="mt-0.5 font-jp">${ev.desc}</span>
                                    </li>
                                </ul>
                                
                                <div class="flex justify-between items-center mt-4 pt-3 border-t border-dashed border-gray-100">
                                    ${showCostBadge ? `
                                    <span class="text-xs font-medium text-emerald-600 bg-emerald-50 px-2 py-1 rounded border border-emerald-100 font-en">
                                        💰 ${ev.cost > 0 ? '¥' + ev.cost.toLocaleString() : 'Free'}
                                    </span>` : '<span></span>'}
                                    
                                    ${ev.address ? `
                                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ev.address)}" target="_blank" class="text-xs flex items-center text-blue-500 hover:text-blue-700 font-bold transition-colors bg-blue-50 px-3 py-1.5 rounded-full font-jp">
                                            導航 GO 🗺️
                                        </a>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            content += `</div>`; // End timeline

            // Guide Section
            content += `
                <div class="mt-10 p-5 bg-gradient-to-br from-indigo-50 to-purple-50 rounded-2xl border border-indigo-100/50">
                    <div class="flex items-center mb-3">
                        <span class="text-xl mr-2">🤖</span>
                        <h3 class="font-bold text-indigo-900 font-jp">AI 導遊小貼士</h3>
                    </div>
                    <div class="text-sm text-indigo-900/80 leading-relaxed space-y-2 font-jp">
                        ${day.guide}
                    </div>
                </div>
            `;

            itineraryContent.innerHTML = content;
        }

        // 4. INITIALIZATION
        window.onload = function() {
            updateBudget();
            renderBookingInfo();
            renderTabs();
            switchDay(0);
            updateStickyHeaderPosition(); // Initial calculation
            
            // Handle window resize for sticky header
            window.addEventListener('resize', updateStickyHeaderPosition);
        };
    </script>
</body>
</html>
